name: mirror-gitee

# 仅手动触发。
# 说明：all.zip 约 50MB，从 GitHub 的美国 runner 上传到 Gitee 会因上行太慢而 write
# timeout 失败（实测 53MB 在 900s 内传不完）。因此本 workflow 不设为定时自动跑，
# 改为在「国内/靠近 Gitee 的网络环境」手动触发（或用本机带代理运行脚本）。
# 日常镜像：在国内机器执行 `python .github/scripts/mirror_gitee.py` 即可。
on:
  # 手动触发，可指定版本
  workflow_dispatch:
    inputs:
      version:
        description: '同步指定版本（留空 = 上游最新）'
        required: false
        default: ''

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync to Gitee
        env:
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.version }}" ]; then
            ARGS="--version ${{ github.event.inputs.version }}"
          fi
          python .github/scripts/mirror_gitee.py $ARGS
